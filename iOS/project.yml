name: TAVAttendance
options:
  bundleIdPrefix: com.tava
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true

fileTypes:
  xcstrings:
    buildPhase: resources

packages:
  TeacherPromptRouter:
    path: ../docs/teacher-prompts/ios
  OpenTelemetry:
    url: https://github.com/open-telemetry/opentelemetry-swift-core.git
    from: "2.5.0"
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.55.2"

targets:
  TAVAttendance:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TAVAttendance
    info:
      path: TAVAttendance/Info.plist
      properties:
        CFBundleDisplayName: TAVAttendance
        CFBundleShortVersionString: "1.1.3"
        CFBundleVersion: "8"
        ITSAppUsesNonExemptEncryption: false
        TEACHER_PROMPTS_V2_ENABLED: "$(TEACHER_PROMPTS_V2_ENABLED)"
        TEACHER_PROMPTS_APNS_ENVIRONMENT: "$(TEACHER_PROMPTS_APNS_ENVIRONMENT)"
        # TODO HUMANS.md teacher-prompt pilot: approved HTTPS host + AASA/domains.
        TEACHER_PROMPTS_APPROVED_HOSTS: []
        CFBundleURLTypes:
          - CFBundleURLName: com.tava.teacher-lessons
            CFBundleURLSchemes: [tava]
        # Supabase credentials: values live in the gitignored Config.xcconfig;
        # Info.plist only references the build settings (so secrets stay out of source).
        # Read at runtime via Bundle.main.object(forInfoDictionaryKey:) in SupabaseManager.
        CONVEX_URL: "$(CONVEX_URL)"
        SUPABASE_PROJECT_URL: "$(SUPABASE_PROJECT_URL)"
        SUPABASE_ANON_KEY: "$(SUPABASE_ANON_KEY)"
        NSCameraUsageDescription: "The camera scans student QR codes for kiosk sign-in."
        NSFaceIDUsageDescription: "Face ID unlocks the app and kiosk admin mode."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    # PROD-02: aps-environment entitlement removed 2026-07-11 — personal Apple
    # teams cannot sign the Push capability, blocking all device builds.
    # Restore per HUMANS.md 38 once on a paid Apple Developer team:
    #   entitlements:
    #     path: TAVAttendance/TAVAttendance.entitlements
    #     properties:
    #       aps-environment: development
    dependencies:
      - package: Supabase
        product: Supabase
      - package: TeacherPromptRouter
        product: PromptRouter
    settings:
      base:
        SWIFT_VERSION: "5.9"
        PRODUCT_BUNDLE_IDENTIFIER: com.tava.TAVAttendance
        TEACHER_PROMPTS_V2_ENABLED: "NO"
        # Must match signed aps-environment once capability is approved. Empty fails closed.
        TEACHER_PROMPTS_APNS_ENVIRONMENT: ""
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: "DUU8J39BA7"
      configs:
        Release:
          TEACHER_PROMPTS_V2_ENABLED: "NO"
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "iPhone Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "TAVAttendance App Store 20260731"
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig

  TAVAttendanceTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TAVAttendanceTests
    dependencies:
      - target: TAVAttendance
      - package: TeacherPromptRouter
        product: PromptRouter
    settings:
      base:
        SWIFT_VERSION: "5.9"
        PRODUCT_BUNDLE_IDENTIFIER: com.tava.TAVAttendanceTests
        GENERATE_INFOPLIST_FILE: "YES"

  TAVLayoutLab:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TAVAttendance
        excludes:
          - TAVAttendanceApp.swift
          - Info.plist
          - AppIntents
      - path: TAVAttendance/AppIntents/KioskRouter.swift
      - path: LayoutLab
    info:
      path: LayoutLab/Info.plist
      properties:
        CFBundleDisplayName: TAVA Layout Lab
        UILaunchScreen: {}
    dependencies:
      - package: Supabase
        product: Supabase
      - package: TeacherPromptRouter
        product: PromptRouter
    settings:
      base:
        SWIFT_VERSION: "5.9"
        PRODUCT_BUNDLE_IDENTIFIER: com.tava.LayoutLab
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"

  TAVAttendanceUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TAVAttendanceUITests
    dependencies:
      - target: TAVAttendance
    settings:
      base:
        SWIFT_VERSION: "5.9"
        PRODUCT_BUNDLE_IDENTIFIER: com.tava.TAVAttendanceUITests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  TAVAttendance:
    build:
      targets:
        TAVAttendance: all
        TAVAttendanceTests: [test]
    test:
      targets:
        - TAVAttendanceTests

  TAVAttendanceLayout:
    build:
      targets:
        TAVAttendance: all
        TAVAttendanceUITests: [test]
    test:
      targets:
        - TAVAttendanceUITests

  TAVLayoutLab:
    build:
      targets:
        TAVLayoutLab: all

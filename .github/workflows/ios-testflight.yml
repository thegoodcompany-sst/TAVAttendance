# Manual TestFlight upload for the iOS app. Never runs on push or on a schedule.
#
# Uploading needs Edmund's explicit OK each time. Protect the `testflight`
# environment with a required reviewer in repo settings, and type "upload" in
# the confirm input when dispatching.
#
# Repository (or `testflight` environment) secrets:
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64   App Store Connect API key (team DUU8J39BA7)
#   IOS_DIST_P12_BASE64, IOS_DIST_P12_PASSWORD     Apple Distribution certificate + private key
#   IOS_APPSTORE_PROFILE_BASE64                    "TAVAttendance App Store Push 20261121" profile
#   IOS_RELEASE_XCCONFIG                           full text of iOS/Config.xcconfig for the release backend
# Nothing here submits for App Store review; it only uploads a build to TestFlight.
name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "CFBundleVersion (must be higher than the last uploaded build, currently 8)"
        required: true
      confirm:
        description: 'Type "upload" to upload to TestFlight'
        required: true

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: Archive and upload
    if: ${{ inputs.confirm == 'upload' }}
    runs-on: macos-26
    environment: testflight
    timeout-minutes: 60
    defaults:
      run:
        working-directory: iOS
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate inputs
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]] || { echo "::error::build_number must be an integer"; exit 1; }

      - name: Install signing material
        env:
          P12: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
          ASC_KEY: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dist.p12"
          profiles="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profiles"
          printf '%s' "$PROFILE" | base64 --decode > "$profiles/tava-appstore-push.mobileprovision"
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY" | base64 --decode > "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"

      - name: Write release backend config
        env:
          RELEASE_XCCONFIG: ${{ secrets.IOS_RELEASE_XCCONFIG }}
        run: |
          set -euo pipefail
          [ -n "$RELEASE_XCCONFIG" ] || { echo "::error::IOS_RELEASE_XCCONFIG is empty"; exit 1; }
          umask 077
          printf '%s\n' "$RELEASE_XCCONFIG" > Config.xcconfig

      - name: Set build number
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" TAVAttendance/Info.plist

      - name: Archive (Release)
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild archive \
            -project TAVAttendance.xcodeproj \
            -scheme TAVAttendance \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/TAVAttendance.xcarchive" \
            CODE_SIGN_IDENTITY="Apple Distribution"

      - name: Export and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          options="$RUNNER_TEMP/ExportOptionsUpload.plist"
          cp ExportOptionsTestFlight.plist "$options"
          /usr/libexec/PlistBuddy -c "Set :destination upload" "$options"
          /usr/libexec/PlistBuddy -c "Set :signingCertificate Apple Distribution" "$options"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/TAVAttendance.xcarchive" \
            -exportOptionsPlist "$options" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/asc" "$HOME/Library/MobileDevice/Provisioning Profiles/tava-appstore-push.mobileprovision" Config.xcconfig

# Dependabot version updates — intentionally quiet.
#
# Security (priority #1):
#   Repo setting "Dependabot security updates" is ENABLED. When GitHub
#   opens a vulnerability alert, Dependabot opens a dedicated security PR
#   regardless of the monthly schedule / groups / open-PR limits below.
#   Do not disable that setting to "reduce noise".
#
# Version updates (this file):
#   Monthly, grouped patch+minor, low open-PR caps, one web package
#   manager only (npm — matches CI's `npm ci` + package-lock.json).
#   Major tooling bumps are ignored so they don't spam failed PRs.
#
# History: weekly × 5 ecosystems (incl. dual npm+bun on /web) with limit 5
# each produced ~19 concurrent non-security PRs and CODEOWNERS review spam.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # CI installs web deps with npm ci against package-lock.json.
  # Do NOT also enable the bun ecosystem here — it opened duplicate PRs for
  # the same package.json (e.g. shadcn npm #45 + bun #46). Refresh bun.lock
  # locally after merging npm lockfile PRs if you develop with bun.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 3
    groups:
      web-production:
        dependency-type: production
        update-types:
          - minor
          - patch
      web-development:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # Intentional major upgrades only — auto majors routinely fail CI.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint-config-next
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]

  - package-ecosystem: gradle
    directory: /Android
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 2
    groups:
      # Explicit library patterns only — do NOT use "*" (that pulled the
      # Gradle wrapper jar/scripts into a 12-dep megapack PR).
      android-deps:
        patterns:
          - "androidx*"
          - "com.google*"
          - "com.android*"
          - "org.jetbrains*"
          - "io.github*"
          - "io.ktor*"
          - "junit*"
        update-types:
          - minor
          - patch
    ignore:
      # Date-stamped Compose BOM majors need intentional UI QA.
      - dependency-name: "androidx.compose:compose-bom"
        update-types: ["version-update:semver-major"]
      # Wrapper upgrades are supply-chain sensitive — do them manually.
      - dependency-name: "gradle"
      - dependency-name: "org.gradle:*"

  # Dependabot discovers the Xcode project's committed SwiftPM Package.resolved.
  - package-ecosystem: swift
    directory: /iOS
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 2
    groups:
      ios-deps:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

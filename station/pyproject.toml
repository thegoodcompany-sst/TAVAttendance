[project]
name = "tava-arrival-station"
version = "0.1.0"
description = "TAVA NFC arrival station for Raspberry Pi OS, Orange Pi, and Armbian."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
nfc = ["pyscard>=2.0"]

[project.scripts]
tava-arrival-station = "tava_station.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tava_station*"]

[tool.setuptools.package-data]
tava_station = ["static/index.html"]

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TAVA arrival</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      background: #193775;
    }
    main { text-align: center; padding: 2rem; }
    h1 { font-size: clamp(2.5rem, 8vw, 6rem); margin: 0 0 .4em; }
    p { font-size: clamp(1.25rem, 4vw, 2.5rem); margin: 0; opacity: .95; }
    body.ok { background: #157a3a; }
    body.late { background: #c45c12; }
    body.info { background: #1f4f8a; }
    body.fail { background: #9b1c1c; }
    body.idle { background: #193775; }
  </style>
</head>
<body class="idle">
  <main>
    <h1 id="title">Tap card</h1>
    <p id="detail">Hold the card on the reader.</p>
  </main>
  <script>
    async function tick() {
      try {
        const res = await fetch("/cue", { cache: "no-store" });
        const cue = await res.json();
        document.body.className = cue.tone || "idle";
        document.getElementById("title").textContent = cue.title || "Tap card";
        document.getElementById("detail").textContent = cue.detail || "";
      } catch (e) {
        document.body.className = "fail";
        document.getElementById("title").textContent = "Could not sign in";
        document.getElementById("detail").textContent = "Use paper and tell a tutor.";
      }
    }
    tick();
    setInterval(tick, 400);
  </script>
</body>
</html>
